plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.20.1'
}

group = 'com.zhangwenbing.agent'
def cliVersion = providers.gradleProperty('pluginVersion').orNull?.trim()
version = cliVersion ? cliVersion : '1.3.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.3')
        bundledPlugin('org.jetbrains.plugins.terminal')
    }
}

intellijPlatform {
    pluginConfiguration {
        version = project.version.toString()
        ideaVersion {
            sinceBuild = '243'
            untilBuild = provider { null }
        }
    }
}

tasks.buildSearchableOptions { enabled = false }
tasks.prepareJarSearchableOptions { enabled = false }
tasks.jarSearchableOptions { enabled = false }

publishPlugin {
    token = System.getenv('PUBLISH_TOKEN')
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
