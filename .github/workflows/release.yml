name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v1.3.0，将自动创建或更新对应 Release）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    env:
      HAS_PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse release version
        id: version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="${RAW_TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::标签名格式不正确: '${TAG}'，请使用类似 v1.3.0 的语义化版本标签。"
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE="false"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "已解析发布版本: tag=${TAG}, version=${VERSION}, prerelease=${PRERELEASE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and verify plugin
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure buildPlugin -PpluginVersion="${{ steps.version.outputs.version }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          shopt -s nullglob
          ZIPS=(build/distributions/*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "::error::未在 build/distributions/ 下找到任何插件 ZIP 包。"
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "检测到已存在 Release (${RELEASE_TAG})，仅上传并覆盖构建产物..."
            gh release upload "${RELEASE_TAG}" "${ZIPS[@]}" --clobber
          else
            echo "创建 GitHub Release (${RELEASE_TAG}) 并上传构建产物..."
            ARGS=(
              --title "${RELEASE_TAG}"
              --generate-notes
            )
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              ARGS+=(--target "${GITHUB_SHA}")
            else
              ARGS+=(--verify-tag)
            fi
            if [ "${PRERELEASE}" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "${ZIPS[@]}" "${ARGS[@]}"
          fi

      - name: Publish to JetBrains Marketplace
        if: env.HAS_PUBLISH_TOKEN == 'true' && steps.version.outputs.prerelease == 'false'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -PpluginVersion="${{ steps.version.outputs.version }}"
